services:
  app:
    build:
      context: .
      dockerfile: Dockerfile23
    depends_on:
      redis:
        condition: service_healthy
    environment:
      GREETING: "${GREETING:-hello}"
      STORAGE: redis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=12)"
      interval: 5s
      timeout: 15s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  redis-data:
